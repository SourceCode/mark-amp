# CI Performance Gate — Phase 34
#
# Runs benchmarks on every PR and compares against baseline.
# Fails if any benchmark regresses by more than 10%.

name: Performance Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/external/vcpkg
          vcpkgJsonGlob: "**/vcpkg.json"

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-benchmark-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-benchmark-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMARKAMP_BUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build benchmarks
        run: cmake --build build --target markamp_bench

      - name: Run benchmarks
        run: |
          ./build/benchmarks/markamp_bench \
            --benchmark_format=json \
            --benchmark_out=benchmark_results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

      - name: Compare against baseline
        run: |
          echo "Benchmark results saved. Manual comparison against baseline."
          echo "TODO: Integrate benchmark comparison tool."
